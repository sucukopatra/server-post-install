# {{NAS_MOUNT_UNIT}} is the systemd-escaped .automount unit for NAS, rendered
# by run.sh. Wants=/After= the .automount: not RequiresMountsFor= (a dead NAS
# would stop dockerd) and not the .mount (Wants= would force the NFS mount at
# boot and wait out its timeout). Containers guard against an unmounted $NAS
# themselves; see compose.yml.
[Unit]
Wants={{NAS_MOUNT_UNIT}}
After={{NAS_MOUNT_UNIT}}
