# {{NAS_MOUNT_UNIT}} is the systemd-escaped .automount unit for NAS in
# config/site.env. systemd cannot expand a variable here and the escaped
# name is not a path, so run.sh renders this file at install time rather
# than rewriting a path in it like it does for the other units.
#
# Two things have to be right here, and they are separate: the dependency
# *type*, and the unit it names.
#
# Type. RequiresMountsFor= is what used to be here, and it is a hard
# dependency. Measured on bmo 2026-08-03:
#
#   systemctl show docker.service -p Requires -p After
#     -> Requires=srv-nas.mount  After=srv-nas.mount
#
# docker.service could not start unless the NFS mount succeeded. A NAS
# that was down at boot took dockerd with it, and every container on the
# host: technitium's LAN DNS first, which is the failure
# docker-update.service refuses to accept for $DATA in as many words.
# nofail does not cover it; that governs local-fs.target's dependency on
# the mount, not this one.
#
# Unit. The measurement above is also the reason this file must not name
# the .mount unit, which is what RequiresMountsFor= had resolved to.
# x-systemd.automount generates two units: srv-nas.automount, which is
# cheap and always succeeds, and srv-nas.mount, which is the real NFS
# mount and carries noauto so that only the automount pulls it in. Wants=
# starts whatever it names regardless of that noauto -- so
# Wants=srv-nas.mount forces the real mount at boot, and After= then
# waits for it. With the NAS off that is DefaultTimeoutStartSec (90s) of
# dead air before dockerd starts, on every boot: a smaller outage than
# RequiresMountsFor= gave, but the same kind, and the same one the
# automount was adopted to end.
#
# Naming the .automount unit gives the ordering with none of the waiting.
# The export is then mounted on first access, by the first container that
# touches it, which is where a NAS failure belongs.
#
# What Wants= gives up is the guarantee that the export is really there
# before containers start -- and a container that bind-mounts an unmounted
# $NAS sees an empty directory rather than an error, which for jellyfin
# means a library scan that can prune items and their watch state. That is
# not handled here. It is handled per container, by binding a path that
# only exists inside the export with bind.create_host_path: false, so the
# container refuses to start instead of starting against nothing. See the
# stacks under compose/.
[Unit]
Wants={{NAS_MOUNT_UNIT}}
After={{NAS_MOUNT_UNIT}}
