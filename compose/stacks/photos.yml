services:
  # Variables listed explicitly rather than `env_file: .env`, which handed both
  # containers every secret in the file. A new Immich release wanting a new
  # variable means adding a line here, which is the point. DB_HOSTNAME and
  # REDIS_HOSTNAME match Immich's own defaults, spelled out so a change to
  # those defaults cannot quietly repoint the server.
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
    - ${DATA}/photos:/data
    - /etc/localtime:/etc/localtime:ro
    environment:
    - TZ=${TZ}
    - DB_HOSTNAME=database
    - DB_USERNAME=${DB_USERNAME}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_DATABASE_NAME=${DB_DATABASE_NAME}
    - REDIS_HOSTNAME=redis
    depends_on:
    - redis
    - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
    - core
    expose:
    - "2283"
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
    - model-cache:/cache
    environment:
    - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
    - core
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
    - core
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
    - ${CONFIG}/immich/database:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
    - core
volumes:
  model-cache: null
