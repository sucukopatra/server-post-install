services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      MEMORY: "8192M"
      MOTD: "helo"
      USE_MEOWICE_FLAGS: "true"
      TZ: ${TZ}
      DIFFICULTY: "2"
      ONLINE_MODE: "false"
      OPS: |-
        sucukopatra
      EXISTING_OPS_FILE: "SYNCHRONIZE"
      MODRINTH_PROJECTS: |-
        fabric-api
        skinrestorer?
        lithium?
        ferrite-core?
        alternate-current?
        chunky?
        spark?
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "alpha"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
    volumes:
      - "${DATA}/games/minecraft:/data"
    networks:
      - core
